name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests and Lint - Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Validate dependency consistency
        run: python -m pip check

      - name: Audit locked dependencies
        run: |
          python -m pip_audit -r requirements.lock
          python -m pip_audit -r requirements-dev.lock

      - name: Run Ruff
        run: python -m ruff check src app tests

      - name: Check Ruff formatting
        run: python -m ruff format --check src app tests

      - name: Run test suite with coverage gate
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-fail-under=70
